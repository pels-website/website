<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.title">Your Name / Project</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
</head>
<body>
  <header>
    <div class="header-top">
      <div>
        <h1 data-i18n="header.name">Your Name</h1>
        <p data-i18n="header.tagline">Short tagline or description</p>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="en" aria-pressed="false">
          <img src="svg/en.svg" alt="" width="24" height="18">
          <span>EN</span>
        </button>
        <button class="lang-btn" data-lang="lt" aria-pressed="true">
          <img src="svg/lt.svg" alt="" width="24" height="18">
          <span>LT</span>
        </button>
        <button class="lang-btn" data-lang="ru" aria-pressed="false">
          <img src="svg/ru.svg" alt="" width="24" height="18">
          <span>RU</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <img src="photo.png" alt="Description of the image" class="hero" data-i18n-alt="hero.alt">

    <section>
      <h2 data-i18n="about.heading">About</h2>
      <p data-i18n="about.text">A few sentences about you or the project.</p>
    </section>

<section class="contacts">
  <h2 data-i18n="contacts.heading">Contacts</h2>

  <div class="contact-details">
    <div class="contact-line">
      <img src="svg/phone.svg" alt="" width="20" height="20">
      <div>
        <a href="#" data-contact="phone" class="contact-value">+370 600 00000</a>
        <div class="contact-note" data-i18n="contacts.messengers">Telegram · WhatsApp · Viber</div>
      </div>
    </div>

    <div class="contact-line">
      <img src="svg/email.svg" alt="" width="20" height="20">
      <a href="#" data-contact="email" class="contact-value">you@example.com</a>
    </div>

    <div class="contact-line">
      <img src="svg/location.svg" alt="" width="20" height="20">
      <div>
        <span data-i18n="contacts.city">Vilnius, Lithuania</span>
        <div class="contact-note" data-i18n="contacts.locationNote">Meetings in other places in Lithuania are also possible</div>
      </div>
    </div>
  </div>
</section>
  </main>

  <footer>
    <p data-i18n="footer.copyright">© 2026 Your Name</p>
  </footer>

<script>
  const available = ['en', 'lt', 'ru'];
  let contacts = {};
  let currentLangData = {};

  async function loadContacts() {
    try {
      const res = await fetch('data/contacts.json');
      if (!res.ok) throw new Error('not found');
      contacts = await res.json();
    } catch (e) {
      console.warn('Could not load contacts.json', e);
      contacts = {};
    }
  }

  async function loadLang(lang) {
    try {
      const res = await fetch(`data/${lang}.json`);
      if (!res.ok) throw new Error('not found');
      return await res.json();
    } catch {
      if (lang !== 'lt') return loadLang('lt');
      return {};
    }
  }

  function applyContacts() {
    document.querySelectorAll('[data-contact]').forEach(el => {
      const type = el.getAttribute('data-contact');

      // Build correct href
      if (type === 'telegram' && contacts.telegram) {
        el.href = `https://t.me/${contacts.phone}`;
      } else if (type === 'whatsapp' && contacts.phone) {
        el.href = `https://wa.me/${contacts.phone}`;
      } else if (type === 'viber' && contacts.phone) {
        el.href = `viber://chat?number=%2B${contacts.phone}`;
      } else if (type === 'email' && contacts.email) {
        el.href = `mailto:${contacts.email}`;
      } else if (type === 'phone' && contacts.phone) {
        el.href = `tel:+${contacts.phone}`;
      }

      // Accessibility
      const labelKey = `contacts.${type}Label`;
      if (currentLangData[labelKey]) {
        el.setAttribute('aria-label', currentLangData[labelKey]);
        el.title = currentLangData[labelKey];
      }
    });
  }

  async function setLanguage(lang) {
    if (!available.includes(lang)) lang = 'lt';

    currentLangData = await loadLang(lang);

    // Texts
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (currentLangData[key] != null) el.textContent = currentLangData[key];
    });

    // Image alts
    document.querySelectorAll('[data-i18n-alt]').forEach(el => {
      const key = el.getAttribute('data-i18n-alt');
      if (currentLangData[key] != null) el.alt = currentLangData[key];
    });

    document.documentElement.lang = lang;

    // Language buttons state
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.setAttribute('aria-pressed', btn.dataset.lang === lang ? 'true' : 'false');
    });

    localStorage.setItem('lang', lang);

    // Update all contact links + labels
    applyContacts();
  }

  // Language switcher clicks
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  // Init
  (async function init() {
    await loadContacts();

    const saved = localStorage.getItem('lang');
    const browser = (navigator.language || 'lt').slice(0, 2);
    const start = available.includes(saved) ? saved :
                  available.includes(browser) ? browser : 'lt';

    await setLanguage(start);
  })();
</script>

 <!-- Mobile sticky contact bar -->
<nav class="mobile-contacts" aria-label="Quick contacts">
  <a href="#" class="mobile-contact-btn" data-contact="telegram" target="_blank" rel="noopener">
    <img src="svg/telegram.svg" alt="" width="22" height="22">
  </a>
  <a href="#" class="mobile-contact-btn" data-contact="whatsapp" target="_blank" rel="noopener">
    <img src="svg/whatsapp.svg" alt="" width="22" height="22">
  </a>
  <a href="#" class="mobile-contact-btn" data-contact="viber">
    <img src="svg/viber.svg" alt="" width="22" height="22">
  </a>
    <a href="#" class="mobile-contact-btn" data-contact="email">
    <img src="svg/email.svg" alt="" width="22" height="22">
  </a>
  <a href="#" class="mobile-contact-btn" data-contact="phone">
    <img src="svg/phone.svg" alt="" width="22" height="22">
  </a>
</nav> 
</body>
</html>
