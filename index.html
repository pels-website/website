<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Advokatas Vardas Pavardė | Baudžiamoji teisė">
  <meta property="og:description" content="Baudžiamosios teisės advokatas, turintis daugiau nei 45 m. praktikos stažą.">
  <meta property="og:image" content="https://website.ivoev.workers.dev/preview-image.jpg">

  <!-- Twitter Card -->

  <meta name="twitter:title" content="Advokatas Vardas Pavardė | Baudžiamoji teisė">
  <meta name="twitter:description" content="Baudžiamosios teisės advokatas, turintis daugiau nei 45 m. praktikos stažą.">
  <meta name="twitter:image" content="https://website.ivoev.workers.dev/preview-image.jpg">

  <link rel="alternate" hreflang="lt" href="https://website.ivoev.workers.dev/?lang=lt" />
  <link rel="alternate" hreflang="en" href="https://website.ivoev.workers.dev/?lang=en" />
  <link rel="alternate" hreflang="ru" href="https://website.ivoev.workers.dev/?lang=ru" />
  <link rel="alternate" hreflang="x-default" href="https://website.ivoev.workers.dev/" />
  
  <title data-i18n="meta.title"></title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  
  <!-- Allows Google Search & Google Discover to show full-size preview images -->
  <meta name="robots" content="index, follow, max-image-preview:large">

  <meta name="description" content="Baudžiamosios teisės advokatas, turintis daugiau nei 45 m. praktikos stažą.">

  <!-- Google Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LegalService",
    "name": "Vardas Pavardė",
    "image": "https://yourdomain.lt/og-image.jpg",
    "description": "Criminal defense attorney in Lithuania with over 45 years of experience.",
    "knowsLanguage": ["lt", "ru", "en"],
    "areaServed": {
      "@type": "Country",
      "name": "Lithuania"
    },
    "url": "https://yourdomain.lt/",
    "telephone": "+37060000000",
    "email": "you@example.com"
  }
  </script>
</head>
<body>
  <header>
    <div class="header-top">
      <div>
        <h1 data-i18n="header.name"></h1>
        <p data-i18n="header.tagline1"></p>
        <p data-i18n="header.tagline2"></p>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="en" aria-pressed="false" aria-label="English" title="English">
          <img src="svg/en.svg" alt="" width="24" height="18">
        </button>
        <button class="lang-btn" data-lang="lt" aria-pressed="true" aria-label="Lietuvių" title="Lietuvių">
          <img src="svg/lt.svg" alt="" width="24" height="18">
        </button>
        <button class="lang-btn" data-lang="ru" aria-pressed="false" aria-label="Русский" title="Русский">
          <img src="svg/ru.svg" alt="" width="24" height="18">
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Hero Section: Photo + Scannable Bio -->
    <section class="hero-section" id="about">
      <div class="hero-container">
        <img src="photo.png" alt="" class="hero-photo" data-i18n-alt="hero.alt">
        
        <div class="hero-bio">
          <h2 data-i18n="about.heading"></h2>
          
          <p class="hero-intro" data-i18n="about.intro"></p>

          <ul class="hero-bullets">
            <li>
              <strong data-i18n="about.b1_title"></strong>
              <span data-i18n="about.b1_text"></span>
            </li>
            <li>
              <strong data-i18n="about.b2_title"></strong>
              <span data-i18n="about.b2_text"></span>
            </li>
            <li>
              <strong data-i18n="about.b3_title"></strong>
              <span data-i18n="about.b3_text"></span>
            </li>
          </ul>
        </div>
      </div>
    </section>

    <!-- Contacts Section -->
    <section class="contacts" id="contacts">
      <h2 data-i18n="contacts.heading">Contacts</h2>

      <div class="contact-grid">
        <!-- Phone & Messengers -->
        <div class="contact-card">
          <a href="#" class="pictogram-box" data-contact="phone">
            <img src="svg/phone.svg" alt="" width="20" height="20">
          </a>
          <div class="contact-body">
            <div class="phone-row">
              <a href="#" data-contact="phone" class="contact-value phone-link"></a>
              <div class="messenger-chips">
                <a href="#" data-contact="telegram" class="messenger-chip" aria-label="Telegram" target="_blank" rel="noopener">
                  <img src="svg/telegram.svg" alt="" width="15" height="15">
                </a>
                <a href="#" data-contact="whatsapp" class="messenger-chip" aria-label="WhatsApp" target="_blank" rel="noopener">
                  <img src="svg/whatsapp.svg" alt="" width="15" height="15">
                </a>
                <a href="#" data-contact="viber" class="messenger-chip" aria-label="Viber" target="_blank" rel="noopener">
                  <img src="svg/viber.svg" alt="" width="15" height="15">
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Email -->
        <a href="#" data-contact="email" class="contact-card contact-card-link">
          <div class="pictogram-box" data-contact="email">
            <img src="svg/email.svg" alt="" width="20" height="20">
          </div>
          <div class="contact-body">
            <span class="contact-value email-link"></span>
          </div>
        </a>

        <!-- Remote Location & Consultation Requirement -->
        <div class="contact-card contact-card-align-top">
          <div class="pictogram-box" data-contact="location">
            <img src="svg/location.svg" alt="" width="20" height="20">
          </div>
          <div class="contact-body">
            <span class="contact-value contact-intro-title" data-i18n="contacts.intro1"></span>
            <p class="contact-intro-sub" data-i18n="contacts.intro2"></p>
            
            <ul class="consult-list">
              <li>
                <strong data-i18n="consult_in_person_title"></strong>: 
                <span data-i18n="consult_in_person_desc"></span>
              </li>
              <li>
                <strong data-i18n="consult_online_title"></strong>: 
                <span data-i18n="consult_online_desc"></span>
              </li>
            </ul>

            <div class="location-workplace" data-i18n="contacts.workplace"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p data-i18n="footer.copyright"></p>
  </footer>

  <!-- Fixed Left Sidebar (Desktop) / Sticky Bottom Bar (Mobile) -->
  <nav class="mobile-contacts" aria-label="Quick navigation and contacts">
    <a href="#about" class="mobile-contact-btn nav-anchor" aria-label="About" title="About">
      <img src="svg/profile.svg" alt="" width="20" height="20">
    </a>
    <a href="#contacts" class="mobile-contact-btn nav-anchor" data-contact="location" aria-label="Contacts" title="Contacts">
      <img src="svg/location.svg" alt="" width="20" height="20">
    </a>

    <div class="sidebar-divider"></div>

    <a href="#" class="mobile-contact-btn" data-contact="telegram" target="_blank" rel="noopener">
      <img src="svg/telegram.svg" alt="" width="20" height="20">
    </a>
    <a href="#" class="mobile-contact-btn" data-contact="whatsapp" target="_blank" rel="noopener">
      <img src="svg/whatsapp.svg" alt="" width="20" height="20">
    </a>
    <a href="#" class="mobile-contact-btn" data-contact="viber" target="_blank" rel="noopener">
      <img src="svg/viber.svg" alt="" width="20" height="20">
    </a>
    <a href="#" class="mobile-contact-btn" data-contact="email">
      <img src="svg/email.svg" alt="" width="20" height="20">
    </a>
    <a href="#" class="mobile-contact-btn" data-contact="phone">
      <img src="svg/phone.svg" alt="" width="20" height="20">
    </a>
  </nav>
<script>
  const available = ['en', 'lt', 'ru'];
  let contacts = {};
  let currentLangData = {};

  async function loadContacts() {
    try {
      const res = await fetch('data/contacts.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      contacts = await res.json();
    } catch (e) {
      console.warn('[DEBUG] Could not load contacts.json', e.message);
      contacts = {};
    }
  }

  async function loadLang(lang) {
    try {
      console.log(`[DEBUG] Attempting to load data/${lang}.json...`);
      const res = await fetch(`data/${lang}.json`);
      if (!res.ok) throw new Error(`HTTP error ${res.status}`);
      
      const data = await res.json();
      console.log(`[DEBUG] Successfully loaded and parsed ${lang}.json`);
      return data;
    } catch (e) {
      console.error(`[DEBUG] Failed to load/parse ${lang}.json:`, e.message);
      if (lang !== 'lt') {
        console.log(`[DEBUG] Falling back to Lithuanian (lt.json)`);
        return loadLang('lt');
      }
      return {};
    }
  }

  function applyContacts() {
    document.querySelectorAll('[data-contact]').forEach(el => {
      const type = el.getAttribute('data-contact');

      if (type === 'telegram' && contacts.phone) {
        el.href = contacts.telegram 
          ? `tg://resolve?domain=${contacts.telegram}` 
          : `tg://resolve?phone=${contacts.phone}`;
        el.removeAttribute('target');
      } else if (type === 'whatsapp' && contacts.phone) {
        el.href = `https://wa.me/${contacts.phone}`;
        el.target = '_blank';
        el.rel = 'noopener';
      } else if (type === 'viber' && contacts.phone) {
        el.href = `viber://chat?number=%2B${contacts.phone}`;
        el.removeAttribute('target');
      } else if (type === 'email' && contacts.email) {
        el.href = `mailto:${contacts.email}`;
      } else if (type === 'phone' && contacts.phone) {
        el.href = `tel:+${contacts.phone}`;
        if (el.classList.contains('phone-link')) {
          el.textContent = contacts.phone_formatter || contacts.phone_formatted;
        }
      }

      const labelKey = `contacts.${type}Label`;
      if (currentLangData[labelKey]) {
        el.setAttribute('aria-label', currentLangData[labelKey]);
        el.title = currentLangData[labelKey];
      }
    });

    document.querySelectorAll('.email-link').forEach(el => {
      if (contacts.email) el.textContent = contacts.email;
    });
  }

  async function setLanguage(lang) {
    console.log(`[DEBUG] setLanguage triggered for: ${lang}`);
    if (!available.includes(lang)) lang = 'lt';

    currentLangData = await loadLang(lang);
    
    let missingKeys = 0;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (currentLangData[key] != null) {
        el.textContent = currentLangData[key];
      } else {
        missingKeys++;
        console.warn(`[DEBUG] Translation key missing: '${key}' in ${lang}`);
      }
    });

    document.querySelectorAll('[data-i18n-alt]').forEach(el => {
      const key = el.getAttribute('data-i18n-alt');
      if (currentLangData[key] != null) el.alt = currentLangData[key];
    });

    if (missingKeys > 0) {
       console.warn(`[DEBUG] ${missingKeys} keys were missing. Ensure your JSON files are FLAT (e.g. {"header.name": "..."}) and not nested.`);
    }

    document.documentElement.lang = lang;

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.setAttribute('aria-pressed', btn.dataset.lang === lang ? 'true' : 'false');
    });

    localStorage.setItem('lang', lang);
    applyContacts();
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const lang = btn.dataset.lang;
      await setLanguage(lang); // Added await so it resolves before replacing history state
      const url = new URL(window.location.href);
      url.searchParams.set('lang', lang);
      window.history.replaceState({}, '', url);
    });
  });

  (async function init() {
    await loadContacts();

    const urlParams = new URLSearchParams(window.location.search);
    const urlLang = (urlParams.get('lang') || '').toLowerCase();
    const saved = localStorage.getItem('lang');
    const browser = (navigator.language || 'lt').slice(0, 2).toLowerCase();

    const start = available.includes(urlLang) ? urlLang :
                  available.includes(saved) ? saved :
                  available.includes(browser) ? browser : 'lt';

    console.log(`[DEBUG] Initializing page with language: ${start}`);
    await setLanguage(start);
  })();
</script>

</body>
</html>
