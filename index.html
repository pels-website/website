<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">

  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:locale" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="alternate" hreflang="lt" href="/?lang=lt" />
  <link rel="alternate" hreflang="en" href="/?lang=en" />
  <link rel="alternate" hreflang="ru" href="/?lang=ru" />
  <link rel="alternate" hreflang="x-default" href="/" />
  <link rel="canonical" href="" />

  <title data-i18n="meta.title"></title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />

  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="description" content="">

  <script type="application/ld+json">{}</script>
</head>
<body>
  <header>
    <div class="header-top">
      <div>
        <h1 data-i18n="header.name"></h1>
        <p data-i18n="header.tagline1"></p>
        <p data-i18n="header.tagline2"></p>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="en" aria-pressed="false" aria-label="English" title="English">
          <img src="svg/en.svg" alt="" width="24" height="12">
        </button>
        <button class="lang-btn" data-lang="lt" aria-pressed="true" aria-label="Lietuvių" title="Lietuvių">
          <img src="svg/lt.svg" alt="" width="24" height="12">
        </button>
        <button class="lang-btn" data-lang="ru" aria-pressed="false" aria-label="Русский" title="Русский">
          <img src="svg/ru.svg" alt="" width="24" height="12">
        </button>
      </div>
      <div class="share-wrap">
        <button class="share-btn" aria-label="Share" aria-expanded="false" title="Share">
          <img src="svg/share.svg" alt="" width="20" height="20">
        </button>
        <div class="share-panel" hidden>
          <a class="share-option" data-share="email" href="#">
            <img src="svg/email.svg" alt="" width="16" height="16"><span data-i18n="share.email"></span>
          </a>
          <a class="share-option" data-share="telegram" href="#">
            <img src="svg/telegram.svg" alt="" width="16" height="16"><span data-i18n="share.telegram"></span>
          </a>
          <a class="share-option" data-share="whatsapp" href="#">
            <img src="svg/whatsapp.svg" alt="" width="16" height="16"><span data-i18n="share.whatsapp"></span>
          </a>
          <a class="share-option" data-share="viber" href="#">
            <img src="svg/viber.svg" alt="" width="16" height="16"><span data-i18n="share.viber"></span>
          </a>
          <a class="share-option" data-share="sms" href="#">
            <img src="svg/phone.svg" alt="" width="16" height="16"><span data-i18n="share.sms"></span>
          </a>
        </div>
        <span hidden data-i18n="share.text" id="share-msg"></span>
      </div>
    </div>
  </header>

  <main>
    <section class="hero-section" id="about">
      <div class="hero-container">
        <img src="photo.png" alt="" class="hero-photo" data-i18n-alt="hero.alt" fetchpriority="high" width="400" height="500">
        <div class="hero-bio">
          <h2 data-i18n="about.heading"></h2>
          <p class="hero-intro" data-i18n="about.intro"></p>
          <ul class="hero-bullets">
            <li>
              <strong data-i18n="about.b1_title"></strong>
              <span data-i18n="about.b1_text"></span>
            </li>
            <li>
              <strong data-i18n="about.b2_title"></strong>
              <span data-i18n="about.b2_text"></span>
            </li>
            <li>
              <strong data-i18n="about.b3_title"></strong>
              <span data-i18n="about.b3_text"></span>
            </li>
          </ul>
        </div>
      </div>
    </section>

    <section class="contacts" id="contacts">
      <h2 data-i18n="contacts.heading"></h2>
      <div class="contact-grid">
        <div class="contact-card">
          <a href="#" class="pictogram-box" data-contact="phone">
            <img src="svg/phone.svg" alt="" width="20" height="20">
          </a>
          <div class="contact-body">
            <div class="phone-row">
              <a href="#" data-contact="phone" class="contact-value phone-link"></a>
              <div class="messenger-chips">
                <a href="#" data-contact="telegram" class="messenger-chip" aria-label="Telegram" target="_blank" rel="noopener noreferrer">
                  <img src="svg/telegram.svg" alt="" width="15" height="15">
                </a>
                <a href="#" data-contact="whatsapp" class="messenger-chip" aria-label="WhatsApp" target="_blank" rel="noopener noreferrer">
                  <img src="svg/whatsapp.svg" alt="" width="15" height="15">
                </a>
                <a href="#" data-contact="viber" class="messenger-chip" aria-label="Viber" target="_blank" rel="noopener noreferrer">
                  <img src="svg/viber.svg" alt="" width="15" height="15">
                </a>
              </div>
            </div>
          </div>
        </div>

        <a href="#" data-contact="email" class="contact-card contact-card-link">
          <div class="pictogram-box" data-contact="email">
            <img src="svg/email.svg" alt="" width="20" height="20">
          </div>
          <div class="contact-body">
            <span class="contact-value email-link"></span>
          </div>
        </a>

        <div class="contact-card contact-card-align-top">
          <div class="pictogram-box" data-contact="location">
            <img src="svg/location.svg" alt="" width="20" height="20">
          </div>
          <div class="contact-body">
            <span class="contact-value contact-intro-title" data-i18n="contacts.intro1"></span>
            <p class="contact-intro-sub" data-i18n="contacts.intro2"></p>
            <ul class="consult-list">
              <li>
                <strong data-i18n="consult_in_person_title"></strong>:
                <span data-i18n="consult_in_person_desc"></span>
              </li>
              <li>
                <strong data-i18n="consult_online_title"></strong>:
                <span data-i18n="consult_online_desc"></span>
              </li>
            </ul>
            <div class="location-workplace" data-i18n="contacts.workplace"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p data-i18n="footer.copyright"></p>
  </footer>

  <nav class="mobile-contacts" aria-label="Quick navigation and contacts">
    <a href="#about" class="mobile-contact-btn nav-anchor" aria-label="About" title="About">
      <img src="svg/profile.svg" alt="" width="20" height="20">
    </a>
    <a href="#contacts" class="mobile-contact-btn nav-anchor" data-contact="location" aria-label="Contacts" title="Contacts">
      <img src="svg/location.svg" alt="" width="20" height="20">
    </a>
    <div class="sidebar-divider"></div>
    <a href="#" class="mobile-contact-btn" data-contact="telegram" target="_blank" rel="noopener noreferrer">
      <img src="svg/telegram.svg" alt="" width="20" height="20">
    </a>
    <a href="#" class="mobile-contact-btn" data-contact="whatsapp" target="_blank" rel="noopener noreferrer">
      <img src="svg/whatsapp.svg" alt="" width="20" height="20">
    </a>
    <a href="#" class="mobile-contact-btn" data-contact="viber" target="_blank" rel="noopener noreferrer">
      <img src="svg/viber.svg" alt="" width="20" height="20">
    </a>
    <a href="#" class="mobile-contact-btn" data-contact="email">
      <img src="svg/email.svg" alt="" width="20" height="20">
    </a>
    <a href="#" class="mobile-contact-btn" data-contact="phone">
      <img src="svg/phone.svg" alt="" width="20" height="20">
    </a>
  </nav>

  <script>
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const url = new URL(window.location.href);
        url.searchParams.set('lang', btn.dataset.lang);
        window.location.href = url;
      });
    });

    const shareBtn = document.querySelector('.share-btn');
    const sharePanel = document.querySelector('.share-panel');
    const shareMsgEl = document.getElementById('share-msg');
  
    if (shareBtn && sharePanel) {
      shareBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const expanded = shareBtn.getAttribute('aria-expanded') === 'true';
        shareBtn.setAttribute('aria-expanded', String(!expanded));
        sharePanel.hidden = expanded;
      });
  
      document.addEventListener('click', () => {
        shareBtn.setAttribute('aria-expanded', 'false');
        sharePanel.hidden = true;
      });
  
      const shareText = (shareMsgEl?.textContent || '').trim();
      const pageUrl = window.location.href;
      const encodedBody = encodeURIComponent(`${shareText} ${pageUrl}`);
      const subject = encodeURIComponent(document.title);

      document.querySelectorAll('.share-option').forEach(opt => {
        const type = opt.dataset.share;
        if (type === 'email') {
          opt.href = `mailto:?subject=${subject}&body=${encodedBody}`;
        } else if (type === 'telegram') {
          opt.href = `https://t.me/share/url?url=${encodeURIComponent(pageUrl)}&text=${encodeURIComponent(shareText)}`;
          opt.target = '_blank';
          opt.rel = 'noopener noreferrer';
        } else if (type === 'whatsapp') {
          opt.href = `https://wa.me/?text=${encodedBody}`;
          opt.target = '_blank';
          opt.rel = 'noopener noreferrer';
        } else if (type === 'viber') {
          opt.href = `viber://forward?text=${encodedBody}`;
        } else if (type === 'sms') {
          opt.href = `sms:?body=${encodedBody}`;
        }
      });
    }
  </script>
</body>
</html>
